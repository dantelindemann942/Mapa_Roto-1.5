name: Windows EXE

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versión del instalador (sin la letra v)"
        required: true
        default: "0.1.5"
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-desktop.txt
            requirements-build.txt

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: local-ui/package-lock.json

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: powershell
        run: |
          $ManualVersion = "${{ inputs.version }}"
          $Version = if ("${{ github.ref_name }}" -match '^v(.+)$') {
            $Matches[1]
          } elseif ($ManualVersion) {
            $ManualVersion
          } else {
            "0.1.5-dev"
          }
          .\scripts\build_windows.ps1 -Version $Version

      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: mapa-roto-build-diagnostics
          path: |
            build/mapa-roto/warn-mapa-roto.txt
            build/mapa-roto/xref-mapa-roto.html
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: mapa-roto-clip-windows
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14
